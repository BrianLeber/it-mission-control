# Microsoft 365 service health for YOUR tenant (Microsoft publishes no keyless public feed).
# 1. Entra ID → App registrations → New. Add the Microsoft Graph application permission
#    ServiceHealth.Read.All and grant admin consent. Create a client secret.
# 2. Mission Control → Settings → Credentials: m365_tenant_id, m365_client_id, m365_client_secret.
id: m365
name: Microsoft 365
group: Public SaaS
icon: { mono: "365", color: "#c43e1c" }
link: https://admin.microsoft.com/#/servicehealth
sensitivity: viewer
driver: ms-graph-service-health
every: 1h
options:
  tenant_id: ${secret:m365_tenant_id}
  client_id: ${secret:m365_client_id}
  client_secret: ${secret:m365_client_secret}
  include_advisories: false
# A platform gets its own page with a card per service. Names match Microsoft's service
# names; services that show up in incidents are added automatically.
platform: true
components:
  - { name: Exchange Online }
  - { name: SharePoint Online }
  - { name: OneDrive for Business }
  - { name: Microsoft 365 apps }
  - { name: Sway }
  - { name: Microsoft Forms }
  - { name: Planner }
  # Not used here: Teams incidents are still recorded, but never light the board.
  - { name: Microsoft Teams, relevance: ignore, note: "We don't use Teams" }
